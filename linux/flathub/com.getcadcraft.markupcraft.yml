# Generated by stores/linux/flatpak.mjs (docs/0.4-PART2.md S.4) for MarkupCraft.
id: com.getcadcraft.markupcraft
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: markupcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: shell
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/shell/cargo
        CARGO_NET_OFFLINE: "true"
        TAURI_CONFIG: "{\"productName\":\"MarkupCraft\",\"mainBinaryName\":\"markupcraft\",\"identifier\":\"com.getcadcraft.markupcraft\",\"version\":\"0.4.0\",\"bundle\":{\"icon\":[\"../com.getcadcraft.markupcraft-128.png\",\"../com.getcadcraft.markupcraft-512.png\"]}}"
    build-commands:
      - cd src-tauri && cargo --offline build --release --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/cadcraft-desktop /app/bin/markupcraft
      - mkdir -p /app/lib/MarkupCraft && cp -r edition /app/lib/MarkupCraft/app
      - rm -f /app/lib/MarkupCraft/app/.htaccess /app/lib/MarkupCraft/app/web.config /app/lib/MarkupCraft/app/INSTALL.md /app/lib/MarkupCraft/app/sw.js
      - install -Dm644 shell.json /app/lib/MarkupCraft/shell.json
      - install -Dm644 LICENSE /app/lib/MarkupCraft/LICENSE
      - install -Dm644 THIRD_PARTY.md /app/lib/MarkupCraft/THIRD_PARTY.md
      - install -Dm644 com.getcadcraft.markupcraft.desktop /app/share/applications/com.getcadcraft.markupcraft.desktop
      - install -Dm644 com.getcadcraft.markupcraft.metainfo.xml /app/share/metainfo/com.getcadcraft.markupcraft.metainfo.xml
      - install -Dm644 com.getcadcraft.markupcraft.svg /app/share/icons/hicolor/scalable/apps/com.getcadcraft.markupcraft.svg
      - install -Dm644 com.getcadcraft.markupcraft-64.png /app/share/icons/hicolor/64x64/apps/com.getcadcraft.markupcraft.png
      - install -Dm644 com.getcadcraft.markupcraft-128.png /app/share/icons/hicolor/128x128/apps/com.getcadcraft.markupcraft.png
      - install -Dm644 com.getcadcraft.markupcraft-256.png /app/share/icons/hicolor/256x256/apps/com.getcadcraft.markupcraft.png
      - install -Dm644 com.getcadcraft.markupcraft-512.png /app/share/icons/hicolor/512x512/apps/com.getcadcraft.markupcraft.png
    sources:
      - {"type":"git","url":"https://github.com/getcadcraft/desktop-shell.git","tag":"OWNER: shell release tag","commit":"OWNER: commit of that tag"}
      - cargo-sources.json
      - {"type":"archive","url":"https://github.com/getcadcraft/markupcraft/releases/download/markupcraft-v0.4.0/markupcraft-browser-edition-v0.4.0.zip","sha256":"OWNER: SHA-256 from the release SHA256SUMS (edition D.7)","dest":"edition"}
      - { type: file, path: "com.getcadcraft.markupcraft.metainfo.xml" }
      - { type: file, path: "com.getcadcraft.markupcraft.desktop" }
      - { type: file, path: "com.getcadcraft.markupcraft.svg" }
      - { type: file, path: "com.getcadcraft.markupcraft-64.png" }
      - { type: file, path: "com.getcadcraft.markupcraft-128.png" }
      - { type: file, path: "com.getcadcraft.markupcraft-256.png" }
      - { type: file, path: "com.getcadcraft.markupcraft-512.png" }
      - { type: file, path: "THIRD_PARTY.md" }
      - { type: file, path: "shell.json" }
